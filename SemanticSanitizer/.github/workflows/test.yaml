name: Run Tests

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Generate code
        shell: bash
        run: just codegen

      - name: Run tests
        shell: bash
        run: just test
